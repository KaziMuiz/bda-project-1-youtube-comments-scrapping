<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Comment Analyzer</title>
<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --text: #151a2d; --muted: #5d657d;
    --line: #dfe3ee; --accent: #3355d1; --accent-text: #ffffff;
    --bar: #3355d1; --bar-bg: #e6eaf6; --warn-bg: #fff4de; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141c; --card: #1b1e2a; --text: #eceef6; --muted: #9aa2bb;
      --line: #2c3144; --accent: #6f8cff; --accent-text: #0e1220;
      --bar: #6f8cff; --bar-bg: #2a2f45; --warn-bg: #3a3120; --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5;
  }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.7rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; }
  input[type=text], select {
    width: 100%; padding: 11px 12px; font-size: 1rem; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 14px; }
  @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
  button {
    margin-top: 16px; padding: 12px 22px; font-size: 1rem; font-weight: 700; cursor: pointer;
    background: var(--accent); color: var(--accent-text); border: 0; border-radius: 10px;
  }
  button:disabled { opacity: .6; cursor: wait; }
  .error { color: var(--err); font-weight: 600; margin-top: 12px; }
  .meta { color: var(--muted); font-size: .9rem; }
  .summary { font-size: 1.1rem; font-weight: 600; margin: 8px 0 0; }
  .topic { margin: 16px 0; }
  .topic-head { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; }
  .bar-bg { background: var(--bar-bg); border-radius: 8px; height: 12px; margin-top: 6px; overflow: hidden; }
  .bar { background: var(--bar); height: 100%; border-radius: 8px; }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
  .comment { border-left: 3px solid var(--line); padding: 4px 0 4px 12px; margin: 8px 0; font-size: .95rem; white-space: pre-wrap; }
  .comment small { color: var(--muted); display: block; }
  .note { background: var(--warn-bg); border-radius: 10px; padding: 12px 14px; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>YouTube Comment Analyzer</h1>
  <p class="sub">Paste a video link. See what viewers are talking about.</p>

  <div class="card">
    <label for="url">YouTube video link</label>
    <input id="url" type="text" placeholder="https://www.youtube.com/watch?v=...">
    <div class="row">
      <div>
        <label for="mode">Mode</label>
        <select id="mode">
          <option value="product">Product review video</option>
          <option value="creator">Creator feedback</option>
        </select>
      </div>
      <div>
        <label for="order">Which comments</label>
        <select id="order">
          <option value="relevance">Top comments</option>
          <option value="time">Most recent</option>
        </select>
      </div>
      <div>
        <label for="limit">How many</label>
        <select id="limit">
          <option value="200">200</option>
          <option value="300" selected>300</option>
          <option value="500">500</option>
        </select>
      </div>
    </div>
    <button id="go">Analyze comments</button>
    <div id="error" class="error" hidden></div>
  </div>

  <div id="results" hidden>
    <div class="card">
      <div class="meta" id="meta"></div>
      <h2 id="title" style="margin:4px 0 0;font-size:1.15rem;"></h2>
      <p class="summary" id="summary"></p>
    </div>
    <div class="card">
      <div id="topics"></div>
    </div>
    <div class="note">
      Topics are found with keyword rules, so sarcasm and misspellings can be missed.
      A comment can belong to more than one topic. Spam-like comments are removed before counting.
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);

async function analyze() {
  const url = $("url").value.trim();
  $("error").hidden = true;
  $("results").hidden = true;
  if (!url) { showError("Paste a YouTube link first."); return; }

  const params = new URLSearchParams({
    url, mode: $("mode").value, order: $("order").value, limit: $("limit").value,
  });
  $("go").disabled = true;
  $("go").textContent = "Reading comments...";
  try {
    const res = await fetch("/api/analyze?" + params.toString());
    const data = await res.json();
    if (!res.ok) { showError(data.error || "Something went wrong."); return; }
    render(data);
  } catch (e) {
    showError("Could not reach the server. Is app.py running?");
  } finally {
    $("go").disabled = false;
    $("go").textContent = "Analyze comments";
  }
}

function showError(msg) {
  $("error").textContent = msg;
  $("error").hidden = false;
}

function render(d) {
  $("meta").textContent = d.mode_label + " · " + d.channel + " · " + d.analyzed + " comments analyzed";
  $("title").textContent = d.title;
  $("summary").textContent = d.summary;

  const box = $("topics");
  box.replaceChildren();
  const max = Math.max(...d.topics.map((t) => t.share), 1);

  d.topics.forEach((t) => {
    const wrap = document.createElement("div");
    wrap.className = "topic";

    const head = document.createElement("div");
    head.className = "topic-head";
    const name = document.createElement("span");
    name.textContent = t.label;
    const val = document.createElement("span");
    val.textContent = t.share + "% (" + t.count + ")";
    head.append(name, val);

    const barBg = document.createElement("div");
    barBg.className = "bar-bg";
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.style.width = (t.share / max * 100) + "%";
    barBg.append(bar);

    wrap.append(head, barBg);

    if (t.top_comments.length) {
      const det = document.createElement("details");
      const sum = document.createElement("summary");
      sum.textContent = "Most-liked comments on this topic";
      det.append(sum);
      t.top_comments.forEach((c) => {
        const p = document.createElement("div");
        p.className = "comment";
        p.textContent = c.text;
        const small = document.createElement("small");
        small.textContent = c.likes + " likes";
        p.append(small);
        det.append(p);
      });
      wrap.append(det);
    }
    box.append(wrap);
  });

  if (d.spam_removed) {
    const s = document.createElement("div");
    s.className = "meta";
    s.textContent = d.spam_removed + (d.spam_removed === 1 ? " spam-like comment was" : " spam-like comments were") + " removed before counting.";
    box.append(s);
  }
  $("results").hidden = false;
}

$("go").addEventListener("click", analyze);
$("url").addEventListener("keydown", (e) => { if (e.key === "Enter") analyze(); });
</script>
</body>
</html>
